name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -timeout=5m ./...

  macos-package:
    name: Build macOS installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build packages
        run: |
          for ARCH in amd64 arm64; do
            scripts/package/build-pkg.sh 0.0.0 "$ARCH"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/vex-agent_*.pkg
